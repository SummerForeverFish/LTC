# run_bollinger.ini - 布林带均值回归策略回测示例 (bar 驱动)
# 用法: build\ltc.exe run config\run_bollinger.ini
#
# 内置类型 Bollinger 由 strategies/register_builtin.cpp 注册：
#   Bollinger  布林带均值回归(bar驱动)   参数: window,k,vol
#     window  布林窗口周期（默认 20）
#     k       标准差倍数（默认 2.0）
#     vol     每笔固定手数（默认 1.0）

[run]
mode = backtest
data_file = data/BTCUSDT.csv
vt_symbol = BTCUSDT.BINANCE_USDT
capital = 1000000
commission = 0.0004
slippage = 0
speed_ms = 0
run_seconds = 0

[strategy]
name = BBTest
type = Bollinger
params = window=20,k=2.0,vol=1.0
