# run_bollinger_plugin_tick.ini - 用 tick 数据驱动布林带插件（tick 合成 1 分钟 K 线）
# 用法: build\ltc.exe run config\run_bollinger_plugin_tick.ini
#
# 关键点：mode=tick_backtest 只把逐笔 tick 喂给策略 on_tick；插件内部用 BarGenerator
# 把 tick 聚合成 1 分钟 K 线，收口时回调 on_bar 执行布林带信号。无需预聚合的 bar 数据。

[run]
mode = tick_backtest
data_file = data/BTCUSDT_tick.csv
vt_symbol = BTCUSDT.BINANCE_USDT
capital = 1000000
commission = 0.0004
slippage = 0
speed_ms = 0
run_seconds = 15

[plugins]
bollinger = plugins/bollinger_plugin.dll

[strategy]
name = BBPlugTick
type = BollingerPlugin
params = window=20,k=2.0,vol=1.0,live=1
