# run_builtin.ini - 使用「内置注册表」策略的配置示例（不加载任何外部 DLL）
# 用法: build\ltc.exe run config\run_builtin.ini
#
# 与 run.ini 的区别：这里没有 [plugins]，type 用的是内置类型 TickDemo。
# 内置类型由 strategies/register_builtin.cpp 注册：
#   DoubleMA   双均线穿越(bar驱动)   参数: fast,slow,vol
#   TickDemo   tick直喂快慢均线      参数: live,fast,slow,vol
#   CtpDemo    CTP tick聚合分钟线    参数: live,fast,slow,vol

[run]
mode = tick_backtest
data_file = data/BTCUSDT_tick.csv
vt_symbol = BTCUSDT.BINANCE_USDT
capital = 1000000
commission = 0.0004
slippage = 0
speed_ms = 0
run_seconds = 15

[strategy]
name = TickMA
type = TickDemo
params = live=1,fast=50,slow=200,vol=1.0

# 想换成双均线 bar 回测，只要改这三行（外加 [run] mode=backtest、data_file 换成 bar 数据）：
# [run]
# mode = backtest
# data_file = data/BTCUSDT.csv
# [strategy]
# name = DoubleMA
# type = DoubleMA
# params = fast=10,slow=30,vol=1.0
