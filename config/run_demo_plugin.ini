# run_demo_plugin.ini - 运行外部插件策略 MomentumTick (demo_plugin.dll)
# 用法(在 vncpp 目录下执行，使相对路径 data/ 与 plugins/ 能正确解析):
#   build\ltc.exe run config\run_demo_plugin.ini
#
# 不改动主程序、也不重编主程序：只需把策略编成 DLL，并在 [plugins] 指明路径、
# 在 [strategy] 指明插件导出的 type 即可。
# demo_plugin.cpp 导出的类型名为 MomentumTick，参数: window,threshold,vol,live

[run]
# tick_backtest = tick 级回测（下一笔 tick 撮合，无未来函数）
mode = tick_backtest
data_file = data/BTCUSDT_tick.csv
vt_symbol = BTCUSDT.BINANCE_USDT
capital = 1000000
commission = 0.0004
slippage = 0
speed_ms = 0

# ---- 外部策略插件 ----
[plugins]
demo = plugins/demo_plugin.dll

# ---- 主策略 ----
# type 必须与 demo_plugin.dll 中 ltc_plugin_strategy_type 返回的名称一致 (MomentumTick)
[strategy]
name = Momentum1
type = MomentumTick
# window=价格滑动窗口长度; threshold=动量阈值; vol=单笔仓位; live=1 才真正下单(0=仅打信号日志)
params = window=30,threshold=0.0002,vol=1.0,live=1
