# run_bollinger_plugin.ini - 通过外部插件加载布林带策略的回测示例
# 用法: build\ltc.exe run config\run_bollinger_plugin.ini
#
# 与 run_bollinger.ini 的区别：这里不依赖内置类型 Bollinger，而是用 [plugins] 加载
# plugins/bollinger_plugin.dll，该 DLL 导出类型 BollingerPlugin。主程序无需重编。
#
# 插件类型 BollingerPlugin 参数：window(布林窗口), k(标准差倍数), vol(固定手数), live(是否真实报单)

[run]
mode = backtest
data_file = data/BTCUSDT.csv
vt_symbol = BTCUSDT.BINANCE_USDT
capital = 1000000
commission = 0.0004
slippage = 0
speed_ms = 0
run_seconds = 0

[plugins]
bollinger = plugins/bollinger_plugin.dll

[strategy]
name = BBPlug
type = BollingerPlugin
params = window=20,k=2.0,vol=1.0,live=1
