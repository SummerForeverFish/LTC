# run_myplugin.ini - 测试刚写的外部插件策略 MACross
# 用法: build\ltc.exe run config\run_myplugin.ini
#
# 这条配置不修改主程序一行代码，只加载 plugins/my_ma_plugin.dll 并运行其中导出的 MACross 类型。

[run]
# tick_backtest = tick 级回测（下一笔 tick 撮合，无未来函数）
mode = tick_backtest
data_file = data/BTCUSDT_tick.csv
vt_symbol = BTCUSDT.BINANCE_USDT
capital = 1000000
commission = 0.0004
slippage = 0
speed_ms = 0

# ---- 外部策略插件 ----
[plugins]
ma = plugins/my_ma_plugin.dll

# ---- 主策略 ----
# type 必须与插件 ltc_plugin_strategy_type 返回的名称一致
[strategy]
name = MACross1
type = MACross
params = fast=30,slow=120,vol=1.0,live=1
