# run.ini - 运行配置：模式 / 插件 / 策略 全部由本文件决定
# 用法: build\ltc.exe run config\run.ini
#
# 本示例演示「外部 DLL 插件」路径：策略 MomentumTick 由 plugins/demo_plugin.dll 提供，
# 主程序事先并不认识它，运行时由 [plugins] 加载后注册进策略表。

[run]
# backtest | live_csv | live_binance | live_ctp | tick_csv | tick_backtest
mode = tick_backtest
data_file = data/BTCUSDT_tick.csv
vt_symbol = BTCUSDT.BINANCE_USDT
capital = 1000000
commission = 0.0004
slippage = 0
speed_ms = 0
run_seconds = 15

# ---- 外部策略插件（可选）----
# 启动时按序加载；插件导出的策略类型会注册进策略表，之后与内置策略无差别。
# 卸载/换策略只需改这里，主程序不用重新编译。
[plugins]
demo = plugins/demo_plugin.dll

# ---- 主策略 ----
# type 必须是已注册的类型（内置的 DoubleMA/TickDemo/CtpDemo，或插件提供的类型）
[strategy]
name = MomentumTick
type = MomentumTick
params = window=30,threshold=0.0002,vol=1.0,live=1

# ---- 追加策略（可选）----
# 需要同时跑多个策略时，用 [strategy.2] [strategy.3] ... 依次追加
;[strategy.2]
;name = TickMA2
;type = TickDemo
;params = live=0,fast=50,slow=200,vol=1.0

# ---- CTP 期货实盘（mode=live_ctp 时生效）----
# 注意：填入真实账号密码后，请把本文件加入 .gitignore，避免泄露。
[ctp]
md_front = tcp://180.168.146.187:10131
td_front = tcp://180.168.146.187:10130
broker_id = 9999
user_id =
password =
instruments = rb2610
live_trading = 0
run_seconds = 30
